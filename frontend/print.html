<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impressão · Morphomatrix</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">
  <script type="module" src="js/print.js"></script>
</head>
<body class="print-body">
  <div class="print-toolbar" id="print-toolbar" hidden>
    <button type="button" class="btn btn-primary" id="print-btn">Imprimir / Salvar PDF</button>
    <a class="btn" id="back-to-editor" href="./">Voltar ao editor</a>
    <p class="hint">
      No diálogo de impressão, escolha o destino "Salvar como PDF", o tamanho do papel (A3 ou A4),
      a orientação e a escala.
    </p>
  </div>

  <main class="print-page">
    <p id="print-status" class="empty-state" role="status">Carregando…</p>
    <div id="print-content" hidden></div>
  </main>
</body>
</html>
