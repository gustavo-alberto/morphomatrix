<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Editor · Morphomatrix</title>
  <!-- Apply the saved theme before first paint (see js/theme.js). -->
  <script>try{var t=localStorage.getItem("morphomatrix.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/editor.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-start">
      <a class="back-link" href="./">← Matrizes</a>
      <h1 class="app-title matrix-title" id="matrix-title"></h1>
    </div>
    <div class="header-end">
      <div class="toolbar" id="editor-toolbar" hidden>
        <button type="button" class="btn btn-primary" id="export-pdf">Exportar PDF</button>
        <a class="btn" id="export-backup" download>Exportar backup</a>
      </div>
      <button type="button" class="btn btn-ghost" id="theme-toggle">Tema</button>
    </div>
  </header>

  <main class="editor-page">
    <p id="editor-status" class="empty-state" role="status">Carregando…</p>
    <div id="editor-content" hidden>
      <div id="combination-bar" class="combination-bar"></div>
      <p id="editor-hint" class="hint editor-hint"></p>
      <div id="table-wrap" class="table-wrap"></div>
    </div>
  </main>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
</body>
</html>
